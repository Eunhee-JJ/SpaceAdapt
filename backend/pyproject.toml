[project]
name = "spaceadapt"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "shapely>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "mlx-vlm>=0.8.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
